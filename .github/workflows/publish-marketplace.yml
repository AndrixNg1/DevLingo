name: Publish to VS Code Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish DevLingo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Configure the Visual Studio Marketplace trusted publishing policy
      # for this GitHub repository and this workflow before publishing.
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --oidc
