name: Feature request
description: Suggest an improvement to DevLingo.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Never include API keys, access tokens or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow and who is affected.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
